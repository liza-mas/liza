name: CI core

on:
  workflow_call:
    inputs:
      setup_python:
        description: Install uv and run the repository's Python test target from its uv.lock
        required: false
        default: false
        type: boolean
      macos_on_pr:
        description: Run the macOS compatibility job for pull requests
        required: false
        default: true
        type: boolean
    outputs:
      verified_sha:
        description: Commit checked out and verified by the Linux CI job
        value: ${{ jobs.linux.outputs.verified_sha }}
permissions:
  contents: read

jobs:
  linux-shard:
    name: Linux tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # internal/ops under -race filled a 2-vCPU runner for ~11 minutes
        # (downstream, private-repository runners), and parallelizing more of
        # its tests did not shorten that. It runs as weighted contiguous
        # ranges of its top-level test names, planned by scripts/ci/testshard
        # from the Windows weights (only their relative size matters). Update
        # the count here only; `total` must match the entries listed.
        include:
          - { suite: core, target: ci-test-core-nosync }
          - { suite: ops-1, cache: ops, group: ops, index: 1, total: 3 }
          - { suite: ops-2, cache: ops, group: ops, index: 2, total: 3 }
          - { suite: ops-3, cache: ops, group: ops, index: 3, total: 3 }
          - { suite: oracle, target: ci-test-oracle-nosync }
          - { suite: integration, target: ci-test-integration-nosync }
          - { suite: cli, target: ci-test-cli-nosync }
    env:
      # A restored GOCACHE must never replay cached test results.
      GOFLAGS: -count=1
    outputs:
      verified_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record verified source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Replaced by the weekly cache below: setup-go keys on go.sum only,
          # so its entry was never refreshed and went stale.
          cache: false

      # One entry per job per ISO week keeps the repository cache footprint
      # bounded; Go trims build-cache entries unused for five days.
      - name: Locate Go caches
        id: go-dirs
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
            echo "week=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-dirs.outputs.gocache }}
            ${{ steps.go-dirs.outputs.gomodcache }}
          key: go-linux-test-${{ matrix.cache || matrix.suite }}-${{ hashFiles('go.sum') }}-${{ steps.go-dirs.outputs.week }}
          restore-keys: |
            go-linux-test-${{ matrix.cache || matrix.suite }}-${{ hashFiles('go.sum') }}-
            go-linux-test-${{ matrix.cache || matrix.suite }}-
            go-linux-test-${{ hashFiles('go.sum') }}-
            go-linux-test-

      # Executes the pi init-gate extension (TypeScript) in its tests; node
      # 24 strips types natively.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: matrix.suite == 'integration' && inputs.setup_python
        with:
          python-version: "3.12"

      # Tests compile embedded files; the lint job verifies they are committed.
      - name: Prepare generated artifacts
        run: make ci-prepare

      # -race -list builds the same test binary the run below reuses. The
      # plan fails unless every listed test falls in exactly one shard; the
      # first and last ranges are open, so tests added later still run.
      - name: Plan shard
        if: matrix.group
        env:
          SHARD_GROUP: ${{ matrix.group }}
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_TOTAL: ${{ matrix.total }}
        run: |
          shard_dir="$RUNNER_TEMP/shard"
          mkdir -p "$shard_dir"
          go build -o "$RUNNER_TEMP/testshard" ./scripts/ci/testshard
          go test -race -list . ./internal/ops > "$shard_dir/list.txt"
          "$RUNNER_TEMP/testshard" plan -group "$SHARD_GROUP" -shards "$SHARD_TOTAL" -index "$SHARD_INDEX" \
            -weights scripts/ci/testshard/windows-weights.json -list "$shard_dir/list.txt" -out "$shard_dir"

      - name: Run Go tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ -z "$TARGET" ]; then
            mapfile -t args < "$RUNNER_TEMP/shard/args.txt"
            go test -race -timeout 30m "${args[@]}"
          else
            make "$TARGET"
          fi

      - name: Run Python tests
        if: matrix.suite == 'integration' && inputs.setup_python
        run: make test-python-nosync

      - name: Save Go caches
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-dirs.outputs.gocache }}
            ${{ steps.go-dirs.outputs.gomodcache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  linux:
    name: Linux tests
    if: always()
    needs: linux-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified_sha: ${{ needs.linux-shard.outputs.verified_sha }}
    steps:
      - name: Require every Linux shard to pass
        env:
          SHARDS_RESULT: ${{ needs.linux-shard.result }}
        run: test "$SHARDS_RESULT" = success

  # Lint, vet, and build run beside the tests instead of before them.
  lint:
    name: Linux lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Replaced by the weekly cache below: setup-go keys on go.sum only,
          # so its entry was never refreshed and went stale.
          cache: false

      # One entry per job per ISO week keeps the repository cache footprint
      # bounded; Go trims build-cache entries unused for five days.
      - name: Locate Go caches
        id: go-dirs
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
            echo "week=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-dirs.outputs.gocache }}
            ${{ steps.go-dirs.outputs.gomodcache }}
          key: go-linux-lint-${{ hashFiles('go.sum') }}-${{ steps.go-dirs.outputs.week }}
          restore-keys: |
            go-linux-lint-${{ hashFiles('go.sum') }}-
            go-linux-lint-

      - name: Prepare and verify generated artifacts
        run: |
          make ci-prepare
          if ! git diff --quiet -- . || \
             [ -n "$(git status --porcelain --untracked-files=all -- .)" ]; then
            echo "ci-prepare changed tracked files; regenerate and commit them:" >&2
            git diff --exit-code -- .
            git status --short --untracked-files=all -- . >&2
            exit 1
          fi

      - name: Run linters
        run: make lint-nosync

      - name: Build
        run: make build-nosync

      - name: Save Go caches
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-dirs.outputs.gocache }}
            ${{ steps.go-dirs.outputs.gomodcache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The Linux suites without race instrumentation, one runner each: a single
  # 3-core runner took 14 minutes. Keep at most five, GitHub's concurrent
  # macOS job limit below Enterprise plans; more would queue.
  macos-shard:
    name: macOS tests (${{ matrix.suite }})
    if: github.event_name != 'pull_request' || inputs.macos_on_pr
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: core, target: ci-test-compat-core-nosync }
          - { suite: ops, target: ci-test-compat-ops-nosync }
          - { suite: oracle, target: ci-test-compat-oracle-nosync }
          - { suite: integration, target: ci-test-integration-nosync }
          - { suite: cli, target: ci-test-compat-cli-nosync }
    env:
      # A restored GOCACHE must never replay cached test results.
      GOFLAGS: -count=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Replaced by the weekly cache below: setup-go keys on go.sum only,
          # so its entry was never refreshed and went stale.
          cache: false

      # One entry per job per ISO week keeps the repository cache footprint
      # bounded; Go trims build-cache entries unused for five days.
      - name: Locate Go caches
        id: go-dirs
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
            echo "week=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-dirs.outputs.gocache }}
            ${{ steps.go-dirs.outputs.gomodcache }}
          key: go-macos-${{ matrix.suite }}-${{ hashFiles('go.sum') }}-${{ steps.go-dirs.outputs.week }}
          restore-keys: |
            go-macos-${{ matrix.suite }}-${{ hashFiles('go.sum') }}-
            go-macos-${{ matrix.suite }}-
            go-macos-${{ hashFiles('go.sum') }}-
            go-macos-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: matrix.suite == 'integration' && inputs.setup_python
        with:
          python-version: "3.12"

      - name: Prepare generated artifacts
        run: make ci-prepare

      # Race coverage runs on Linux; macOS checks platform compatibility.
      - name: Run Go tests
        run: make ${{ matrix.target }}

      - name: Run Python tests
        if: matrix.suite == 'integration' && inputs.setup_python
        run: make test-python-nosync

      - name: Build
        if: matrix.suite == 'cli'
        run: make build-nosync

      - name: Save Go caches
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-dirs.outputs.gocache }}
            ${{ steps.go-dirs.outputs.gomodcache }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  macos:
    name: macOS compatibility
    if: always() && (github.event_name != 'pull_request' || inputs.macos_on_pr)
    needs: macos-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every macOS shard to pass
        env:
          SHARDS_RESULT: ${{ needs.macos-shard.result }}
        run: test "$SHARDS_RESULT" = success
