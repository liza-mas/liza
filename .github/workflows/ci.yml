name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'

      - name: Run linters
        run: make lint

      - name: Run tests
        run: make test

      - name: Run log analyzer tests
        run: uv run --frozen python3 -m pytest skills/liza-logs/scripts

      - name: Run e2e tests
        run: make test-e2e

      - name: Build
        run: make build

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          # Requires CODECOV_TOKEN secret — configure in repo settings
          token: ${{ secrets.CODECOV_TOKEN }}

  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    # The ops package has a pending stdio-handle issue tracked in TECH_DEBT.md;
    # bound the job while leaving headroom for the 30-minute package timeout.
    timeout-minutes: 90
    defaults:
      run:
        # Git Bash. The hooks liza deploys are POSIX shell, and the tests that
        # exercise them resolve this same bash.
        shell: bash
    steps:
      - name: Check out with LF endings
        # Windows runners default to core.autocrlf=true. .gitattributes pins
        # eol=lf, so a fresh checkout is already LF, but a stale global setting
        # is exactly how CRLF gets into shell scripts, where it breaks the
        # shebang. Pin it before anything is written to disk.
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The Makefile targets are not reused here. Linux and macOS already cover
      # the Python pre-commit hooks, while this job answers the narrower native
      # Windows questions: does it build, does it vet, do the tests pass.
      - name: Sync embedded artifacts
        run: go run ./internal/brandrender/cmd/sync-embedded --repo-root .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -timeout 30m ./...

      - name: Build
        run: go build -o liza.exe ./cmd/liza
