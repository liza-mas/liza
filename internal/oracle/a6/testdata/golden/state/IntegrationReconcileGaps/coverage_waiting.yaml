# before
agents: {}
anomalies: []
circuit_breaker:
    history: []
    status: OK
config:
    agent_progress_timeout: 600
    coder_poll_interval: 30
    doer_max_wait: 1800
    heartbeat_interval: 60
    integration_branch: integration
    lease_duration: 1800
    max_coder_iterations: 10
    max_global_integration_generations: 5
    max_review_cycles: 5
    mode: RUNNING
    orchestrator_max_wait: 1800
    orchestrator_poll_interval: 60
    reviewer_max_wait: 1800
    reviewer_poll_interval: 30
discovered: []
goal:
    alignment_history:
        - event: initialization
          summary: Oracle fixture
          timestamp: <TIME:Z>
    base_commit: '<SHA:BASE>'
    created: <TIME:Z>
    description: Oracle fixture
    id: oracle
    integration:
        contributing_set:
            scopes:
                - plan_task_id: plan-multi
                  root_task_ids:
                    - coding-a
                    - coding-b
                - plan_task_id: plan-single
                  root_task_ids:
                    - coding-single
        coverage:
            - approval_attestations:
                - acceptance_criteria: Single coding accepted
                  approver: code-reviewer-1
                  merge_commit: '<SHA:HEAD>'
                  reviewed_commit: '<SHA:HEAD>'
                  reviewed_task_id: coding-single
                  validation:
                    - "true"
              kind: approval_attestation
              plan_task_id: plan-single
    spec_ref: README.md
    status: IN_PROGRESS
human_notes: []
pipeline_version: 3
spec_changes: []
sprint:
    goal_ref: oracle
    id: sprint-1
    metrics:
        iterations_total: 0
        review_cycles_total: 0
        tasks_blocked: 0
        tasks_done: 0
        tasks_in_progress: 0
    number: 1
    scope:
        planned:
            - plan-single
            - coding-single
            - plan-multi
            - coding-b
            - coding-a
            - integration-slice-plan-multi
        stretch: []
    status: IN_PROGRESS
    timeline:
        started: <TIME:Z>
sprint_history: []
tasks:
    - approved_by: code-reviewer-1
      arch_ref: README.md
      created: <TIME:Z>
      description: Plan single scope
      done_when: Single plan implemented
      handoff_events:
        - agent: coder-1
          timestamp: "<TIME:Z>"
          trigger: submission
        - agent: code-reviewer-1
          timestamp: "<TIME:Z>"
          trigger: completion
      history: []
      id: plan-single
      merge_commit: '<SHA:BASE>'
      output:
        - desc: Single coding scope
          done_when: Coded
          scope: fixture
          spec_ref: README.md
      plan_ref: README.md
      priority: 1
      review_commit: '<SHA:BASE>'
      role_pair: code-planning-pair
      scope: fixture
      spec_ref: README.md
      status: MERGED
      transitions_executed:
        code-plan-to-coding: true
      type: planning
    - approved_by: code-reviewer-1
      base_commit: '<SHA:B>'
      created: <TIME:Z>
      description: Implement single scope
      done_when: Single coding accepted
      handoff_events:
        - agent: coder-1
          timestamp: "<TIME:Z>"
          trigger: submission
        - agent: code-reviewer-1
          timestamp: "<TIME:Z>"
          trigger: completion
      history: []
      id: coding-single
      merge_commit: '<SHA:HEAD>'
      parent_task: plan-single
      priority: 1
      review_commit: '<SHA:HEAD>'
      role_pair: coding-pair
      scope: fixture
      spec_ref: README.md
      status: MERGED
      type: coding
      validation:
        - "true"
    - approved_by: code-reviewer-1
      arch_ref: README.md
      created: <TIME:Z>
      description: Plan multiple scopes
      done_when: Multiple plan implemented
      handoff_events:
        - agent: coder-1
          timestamp: "<TIME:Z>"
          trigger: submission
        - agent: code-reviewer-1
          timestamp: "<TIME:Z>"
          trigger: completion
      history: []
      id: plan-multi
      merge_commit: '<SHA:BASE>'
      output:
        - desc: Multiple coding scopes
          done_when: Coded
          scope: fixture
          spec_ref: README.md
      plan_ref: README.md
      priority: 1
      review_commit: '<SHA:BASE>'
      role_pair: code-planning-pair
      scope: fixture
      spec_ref: README.md
      status: MERGED
      transitions_executed:
        code-plan-to-coding: true
      type: planning
    - approved_by: code-reviewer-1
      base_commit: '<SHA:A>'
      created: <TIME:Z>
      description: Implement scope B
      done_when: Coding B accepted
      handoff_events:
        - agent: coder-1
          timestamp: "<TIME:Z>"
          trigger: submission
        - agent: code-reviewer-1
          timestamp: "<TIME:Z>"
          trigger: completion
      history: []
      id: coding-b
      merge_commit: '<SHA:B>'
      parent_task: plan-multi
      priority: 1
      review_commit: '<SHA:B>'
      role_pair: coding-pair
      scope: fixture
      spec_ref: README.md
      status: MERGED
      type: coding
      validation:
        - "true"
    - approved_by: code-reviewer-1
      base_commit: '<SHA:BASE>'
      created: <TIME:Z>
      description: Implement scope A
      done_when: Coding A accepted
      handoff_events:
        - agent: coder-1
          timestamp: "<TIME:Z>"
          trigger: submission
        - agent: code-reviewer-1
          timestamp: "<TIME:Z>"
          trigger: completion
      history: []
      id: coding-a
      merge_commit: '<SHA:A>'
      parent_task: plan-multi
      priority: 1
      review_commit: '<SHA:A>'
      role_pair: coding-pair
      scope: fixture
      spec_ref: README.md
      status: MERGED
      type: coding
      validation:
        - "true"
    - arch_ref: README.md
      created: <TIME:Z>
      description: Analyze integration composition for plan plan-multi.
      done_when: The slice analysis is reviewed and its immutable verdict is recorded.
      history: []
      id: integration-slice-plan-multi
      integration_analysis:
        affected_paths:
            - a.txt
            - b.txt
        descendant_changes:
            - commit: '<SHA:A>'
              task_id: coding-a
            - commit: '<SHA:B>'
              task_id: coding-b
        key: slice:plan-multi
        originating_plan_task_id: plan-multi
        phase: slice
        root_task_ids:
            - coding-a
            - coding-b
        source_commit: '<SHA:HEAD>'
        source_snapshot_paths:
            - a.txt
            - b.txt
      parent_tasks:
        - coding-a
        - coding-b
      plan_ref: README.md
      priority: 1
      role_pair: slice-integration-pair
      scope: Frozen integration slice for plan plan-multi.
      spec_ref: README.md
      status: DRAFT_SLICE_INTEGRATION_ANALYSIS
      type: integration
version: 1
