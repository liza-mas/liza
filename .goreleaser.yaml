# GoReleaser configuration for liza
# See https://goreleaser.com for documentation

version: 2

before:
  hooks:
    - go mod tidy
    - make sync-embedded

builds:
  - id: liza
    main: ./cmd/liza
    binary: '{{ if .Env.BRAND_BINARY_NAME }}{{ .Env.BRAND_BINARY_NAME }}{{ else if .Env.BRAND_NAME_LOWER }}{{ .Env.BRAND_NAME_LOWER }}{{ else }}liza{{ end }}'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.BuildDate={{.Date}}
      - -X github.com/liza-mas/liza/internal/embedded.Version={{.Version}}
      - -X github.com/liza-mas/liza/internal/embedded.GitCommit={{.ShortCommit}}
      - -X github.com/liza-mas/liza/internal/embedded.BuildDate={{.Date}}
      - -X github.com/liza-mas/liza/internal/brand.NameLower={{ if .Env.BRAND_NAME_LOWER }}{{ .Env.BRAND_NAME_LOWER }}{{ else }}liza{{ end }}
      - -X github.com/liza-mas/liza/internal/brand.NameUpper={{ if .Env.BRAND_NAME_UPPER }}{{ .Env.BRAND_NAME_UPPER }}{{ else if .Env.BRAND_NAME_LOWER }}{{ .Env.BRAND_NAME_LOWER | replace "-" "_" | upper }}{{ else }}LIZA{{ end }}
      - "-X 'github.com/liza-mas/liza/internal/brand.NameTitle={{ if .Env.BRAND_NAME_TITLE }}{{ .Env.BRAND_NAME_TITLE }}{{ else if .Env.BRAND_NAME_LOWER }}{{ .Env.BRAND_NAME_LOWER | replace \"-\" \" \" | title }}{{ else }}Liza{{ end }}'"
      - -X github.com/liza-mas/liza/internal/brand.Repo={{ if .Env.BRAND_REPO }}{{ .Env.BRAND_REPO }}{{ else }}liza-mas/liza{{ end }}
      - -X github.com/liza-mas/liza/internal/brand.BinaryName={{ if .Env.BRAND_BINARY_NAME }}{{ .Env.BRAND_BINARY_NAME }}{{ else if .Env.BRAND_NAME_LOWER }}{{ .Env.BRAND_NAME_LOWER }}{{ else }}liza{{ end }}
      - -X github.com/liza-mas/liza/internal/brand.GlobalDirName={{ if .Env.BRAND_GLOBAL_DIRNAME }}{{ .Env.BRAND_GLOBAL_DIRNAME }}{{ else if .Env.BRAND_NAME_LOWER }}.{{ .Env.BRAND_NAME_LOWER }}{{ else }}.liza{{ end }}
      - -X github.com/liza-mas/liza/internal/brand.ProjectDirName={{ if .Env.BRAND_PROJECT_DIRNAME }}{{ .Env.BRAND_PROJECT_DIRNAME }}{{ else if .Env.BRAND_NAME_LOWER }}.{{ .Env.BRAND_NAME_LOWER }}{{ else }}.liza{{ end }}
      - -X github.com/liza-mas/liza/internal/brand.EnvPrefix={{ if .Env.BRAND_ENV_PREFIX }}{{ .Env.BRAND_ENV_PREFIX }}{{ else if .Env.BRAND_NAME_UPPER }}{{ .Env.BRAND_NAME_UPPER }}{{ else if .Env.BRAND_NAME_LOWER }}{{ .Env.BRAND_NAME_LOWER | replace "-" "_" | upper }}{{ else }}LIZA{{ end }}
      - -X github.com/liza-mas/liza/internal/brand.ArchivePrefix={{ if .Env.BRAND_ARCHIVE_PREFIX }}{{ .Env.BRAND_ARCHIVE_PREFIX }}{{ else if .Env.BRAND_BINARY_NAME }}{{ .Env.BRAND_BINARY_NAME }}{{ else if .Env.BRAND_NAME_LOWER }}{{ .Env.BRAND_NAME_LOWER }}{{ else }}liza{{ end }}
      - -X github.com/liza-mas/liza/internal/brand.ReleaseRepo={{ if .Env.BRAND_RELEASE_REPO }}{{ .Env.BRAND_RELEASE_REPO }}{{ else if .Env.BRAND_REPO }}{{ .Env.BRAND_REPO }}{{ else }}liza-mas/liza{{ end }}
      - -X github.com/liza-mas/liza/internal/brand.ReleaseBaseURL={{ if .Env.BRAND_RELEASE_BASE_URL }}{{ .Env.BRAND_RELEASE_BASE_URL }}{{ else }}https://github.com/{{ if .Env.BRAND_RELEASE_REPO }}{{ .Env.BRAND_RELEASE_REPO }}{{ else if .Env.BRAND_REPO }}{{ .Env.BRAND_REPO }}{{ else }}liza-mas/liza{{ end }}/releases/download{{ end }}
      - -X github.com/liza-mas/liza/internal/brand.ChecksumBaseURL={{ if .Env.BRAND_CHECKSUM_BASE_URL }}{{ .Env.BRAND_CHECKSUM_BASE_URL }}{{ else if .Env.BRAND_RELEASE_BASE_URL }}{{ .Env.BRAND_RELEASE_BASE_URL }}{{ else }}https://github.com/{{ if .Env.BRAND_RELEASE_REPO }}{{ .Env.BRAND_RELEASE_REPO }}{{ else if .Env.BRAND_REPO }}{{ .Env.BRAND_REPO }}{{ else }}liza-mas/liza{{ end }}/releases/download{{ end }}

archives:
  - id: liza-archive
    formats:
      - tar.gz
    name_template: >-
      {{- if .Env.BRAND_ARCHIVE_PREFIX }}{{ .Env.BRAND_ARCHIVE_PREFIX }}{{ else if .Env.BRAND_BINARY_NAME }}{{ .Env.BRAND_BINARY_NAME }}{{ else if .Env.BRAND_NAME_LOWER }}{{ .Env.BRAND_NAME_LOWER }}{{ else }}liza{{ end }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - typo
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance Improvements
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: '{{ if index .Env "BRAND_RELEASE_REPO" }}{{ index (split (index .Env "BRAND_RELEASE_REPO") "/") 0 }}{{ else if index .Env "BRAND_REPO" }}{{ index (split (index .Env "BRAND_REPO") "/") 0 }}{{ else }}liza-mas{{ end }}'
    name: '{{ if index .Env "BRAND_RELEASE_REPO" }}{{ index (split (index .Env "BRAND_RELEASE_REPO") "/") 1 }}{{ else if index .Env "BRAND_REPO" }}{{ index (split (index .Env "BRAND_REPO") "/") 1 }}{{ else }}liza{{ end }}'
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## {{ if index .Env "BRAND_NAME_TITLE" }}{{ index .Env "BRAND_NAME_TITLE" }}{{ else if index .Env "BRAND_NAME_LOWER" }}{{ index .Env "BRAND_NAME_LOWER" | replace "-" " " | title }}{{ else }}Liza{{ end }} {{.Tag}}

    A multi-agent supervision system built in Go.

    ### Installation

    **Quick install (macOS/Linux):**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/{{ if index .Env "BRAND_INSTALL_REPO" }}{{ index .Env "BRAND_INSTALL_REPO" }}{{ else if index .Env "BRAND_REPO" }}{{ index .Env "BRAND_REPO" }}{{ else }}liza-mas/liza{{ end }}/main/install.sh | bash
    ```

    **Manual download:**
    Download the appropriate archive for your platform below, extract it, and move the binaries to your PATH.

  footer: |
    ---

    **Full Changelog**: https://github.com/{{ if index .Env "BRAND_RELEASE_REPO" }}{{ index .Env "BRAND_RELEASE_REPO" }}{{ else if index .Env "BRAND_REPO" }}{{ index .Env "BRAND_REPO" }}{{ else }}liza-mas/liza{{ end }}/compare/{{.PreviousTag}}...{{.Tag}}

    ### Verifying Checksums

    Download `checksums.txt` and verify with:
    ```bash
    sha256sum -c checksums.txt 2>&1 | grep OK
    ```

